name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Provide Firebase configuration for the production build
      # ----------------------------------------------------------
      - name: Create Firebase environment file
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_AUTH_DOMAIN" ] && [ -n "$FIREBASE_DATABASE_URL" ] && [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_STORAGE_BUCKET" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_APP_ID" ]; then
            printf '%s\n' \
              "VITE_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              "VITE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
              "VITE_FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL" \
              "VITE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              "VITE_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
              "VITE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
              "VITE_FIREBASE_APP_ID=$FIREBASE_APP_ID" > .env
          else
            echo "Firebase secrets not configured. Falling back to .env.example for CI build."
            cp .env.example .env
          fi


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 9. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 10. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 11. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 12. Rename the generated APK
      # ----------------------------------------------------------
      - name: Daily Task Manager.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DailyTaskManager.apk


      # ----------------------------------------------------------
      # 13. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily Task Manager-APK
          path: DailyTaskManager.apk
          if-no-files-found: error
          retention-days: 30